<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#111312">
<meta name="robots" content="noindex">
<title>Sign in · radiospeak</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23c3f36b'/%3E%3Cpath d='M10 17v6m7-12v18m7-14v10m7-7v4' stroke='%23111312' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#111312;--surface:#1a1d1a;--line:#2b302a;--text:#f1f3ed;--muted:#969f92;--accent:#c3f36b;--danger:#ff9b95;font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:14px;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--text);line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-30% -10% auto;height:70vh;background:radial-gradient(closest-side,#c3f36b1f,transparent 70%);pointer-events:none}
.login{position:relative;width:100%;max-width:400px}
.brand{display:flex;align-items:center;justify-content:center;gap:11px;font-size:27px;font-weight:700;letter-spacing:-1.2px;margin-bottom:28px}
.brand b{color:var(--accent)}
.mark{width:36px;height:36px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;gap:3px;transform:rotate(-4deg);box-shadow:0 8px 30px #c3f36b2e}
.mark i{display:block;flex:none;width:3px;height:12px;border-radius:5px;background:#17200e;animation:eq 1.1s ease-in-out infinite alternate}
.mark i:nth-child(2){height:21px;animation-delay:-.4s}.mark i:nth-child(3){height:15px;animation-delay:-.8s}.mark i:nth-child(4){height:8px;animation-delay:-.2s}
@keyframes eq{to{transform:scaleY(.45)}}
.card{background:linear-gradient(160deg,#20261d,var(--surface) 55%);border:1px solid var(--line);border-radius:16px;padding:32px 28px 28px;box-shadow:0 24px 70px #0007}
.card.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.eyebrow{font-size:10px;letter-spacing:1.9px;font-weight:650;color:var(--accent);display:flex;align-items:center;gap:7px}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 9px #c3f36b55}
h1{font-size:28px;letter-spacing:-1px;line-height:1.2;margin:10px 0 6px;font-weight:650}
.lead{color:var(--muted);margin:0 0 24px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}
.field{display:flex;align-items:center;background:#11170f;border:1px solid #3a4532;border-radius:10px;transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px #c3f36b22}
.field.invalid{border-color:var(--danger)}
input[type=password],input[type=text]{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:15px;padding:13px 14px}
.reveal{background:none;border:0;color:var(--muted);padding:0 14px;height:46px;cursor:pointer;display:grid;place-items:center;border-radius:0 10px 10px 0}
.reveal:hover{color:var(--text)}
svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.check{display:flex;align-items:center;gap:9px;margin:16px 0 22px;font-size:13px;color:#c9d2c2;cursor:pointer;width:fit-content}
.check input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.submit{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;min-height:46px;border:0;border-radius:10px;background:var(--accent);color:#17200e;font:inherit;font-weight:650;font-size:14px;cursor:pointer;transition:background .15s,transform .15s}
.submit:hover:not(:disabled){background:#d4ff89}
.submit:active:not(:disabled){transform:translateY(1px)}
.submit:disabled{opacity:.6;cursor:progress}
.spinner{width:15px;height:15px;border:2px solid #17200e55;border-top-color:#17200e;border-radius:50%;animation:spin .7s linear infinite;display:none}
.submit:disabled .spinner{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.error{min-height:20px;margin:12px 0 0;font-size:13px;color:var(--danger)}
.error:empty{margin:0;min-height:0}
.foot{text-align:center;color:#7f897a;font-size:12px;margin:22px 0 0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.field input:focus-visible{outline:0}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(max-width:420px){.card{padding:26px 20px 22px}h1{font-size:25px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="login">
  <div class="brand" aria-label="radiospeak"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="word">radiospeak<b>.</b></span></div>
  <form class="card" id="login" novalidate>
    <div class="eyebrow">WEB CONTROL PANEL</div>
    <h1>Welcome back.</h1>
    <p class="lead">Sign in to run your channel’s soundtrack.</p>
    <label for="username">Username</label>
    <div class="field"><input id="username" type="text" name="username" value="owner" autocomplete="username" required maxlength="32"></div>
    <label for="password">Panel password</label>
    <div class="field" id="field">
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus aria-describedby="error" placeholder="Enter the password">
      <button class="reveal" type="button" id="reveal" aria-label="Show password" aria-pressed="false" title="Show password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <label class="check"><input type="checkbox" name="remember" checked> Keep me signed in for 30 days</label>
    <button class="submit" type="submit" id="submit"><span class="spinner" aria-hidden="true"></span><span id="submit-label">Sign in</span></button>
    <p class="error" id="error" role="alert"></p>
  </form>
  <p class="foot">Ask your server admin for the panel password.</p>
</main>
<script>
const form = document.getElementById('login'), input = document.getElementById('password'), error = document.getElementById('error');
const submit = document.getElementById('submit'), label = document.getElementById('submit-label'), field = document.getElementById('field');
// Return to the panel view the visitor was on (only a plain #view hash is accepted).
const next = new URLSearchParams(location.search).get('next') || location.hash;
const target = '/' + (/^#[\w-]{1,40}$/.test(next || '') ? next : '');
document.getElementById('reveal').addEventListener('click', event => {
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  const button = event.currentTarget;
  button.setAttribute('aria-pressed', String(show));
  button.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  button.title = show ? 'Hide password' : 'Show password';
  input.focus();
});
input.addEventListener('input', () => { field.classList.remove('invalid'); error.textContent = ''; });
form.addEventListener('submit', async event => {
  event.preventDefault();
  if (!input.value) { fail('Enter the panel password.'); return; }
  submit.disabled = true; label.textContent = 'Signing in…'; error.textContent = '';
  try {
    const response = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: form.username.value, password: input.value, remember: form.remember.checked }) });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.error || 'Could not sign in. Please try again.');
    label.textContent = 'Opening the panel…';
    location.replace(target);
  } catch (err) {
    fail(err.message === 'Failed to fetch' ? 'The panel is not reachable. Check the server and try again.' : err.message);
    submit.disabled = false; label.textContent = 'Sign in';
  }
});
function fail(message) {
  error.textContent = message;
  field.classList.add('invalid');
  form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
  input.select();
}
</script>
</body>
</html>
