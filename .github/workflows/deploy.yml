name: Deploy

# Every push to main is tested, then redeploys the Portainer stack through its webhook.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  redeploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Portainer stack redeploy
        env:
          # Repository secret holding the stack's webhook URL (Settings → Secrets and variables → Actions).
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::Set the PORTAINER_WEBHOOK_URL repository secret to the Portainer stack webhook URL."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 --retry 3 --retry-delay 5 -X POST "$WEBHOOK_URL"
          echo "Portainer redeploy triggered."
