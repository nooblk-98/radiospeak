name: Deploy

# Every push to main is tested, then redeploys the Portainer stack through its webhook.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      force_redeploy:
        description: Rebuild even when the same source is already healthy
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run check
      - run: npm test
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg

  redeploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check health URL configuration
        env:
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: test -n "$DEPLOY_HEALTH_URL" || { echo "::error::Set DEPLOY_HEALTH_URL to the public radiospeak /healthz URL."; exit 1; }
      - name: Trigger Portainer stack redeploy
        id: trigger
        env:
          # Repository secret holding the stack's webhook URL (Settings → Secrets and variables → Actions).
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
          FORCE_REDEPLOY: ${{ inputs.force_redeploy }}
          RADIOSPEAK_DEPLOY_TOKEN: ${{ secrets.RADIOSPEAK_DEPLOY_TOKEN }}
        run: node scripts/deploy.mjs
      - name: Verify deployed source and bot readiness
        if: steps.trigger.outputs.deferred != 'true'
        env:
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
          DEPLOY_TIMEOUT_SECONDS: ${{ steps.trigger.outputs.timeout_seconds }}
        run: node scripts/check-deployment.mjs
